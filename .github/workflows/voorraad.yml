name: PS5 voorraad
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: ps5-stock-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    # Errors remain in the run log, without a failed-workflow email.
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
